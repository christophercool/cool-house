<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cool House</title>
<meta name="apple-mobile-web-app-title" content="Cool House">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
/* VOICE: a real-feeling smart-home app, playful underneath
   IDEA: the Cool House camera app from the show, working for real
   PICTURE: the finished home screen art, with live badge and tappable tiles
   COLOUR and TYPE: from the artwork; red alert badge; system font
   LAYOUT: one 9:16 stage, centred on black, video zooms out of the tile */
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:#000;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;position:fixed;inset:0}
body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,system-ui,sans-serif}
#stage{position:relative;width:min(100vw,calc(100vh * 941 / 2039));height:min(100vh,calc(100vw * 2039 / 941));overflow:hidden;background:#0a1630}
@supports (height:100dvh){#stage{width:min(100vw,calc(100dvh * 941 / 2039));height:min(100dvh,calc(100vw * 2039 / 941))}}
#home{position:absolute;inset:0;width:100%;height:100%;display:block}
.hot{position:absolute;border-radius:4%;cursor:pointer}
.hot.flash{animation:tap .35s ease}
@keyframes tap{40%{box-shadow:0 0 0 .6vh #fff inset,0 0 3vh #fff;background:rgba(255,255,255,.18)}}
#fd{left:2.1%;top:31.63%;width:47.2%;height:20.01%}
#ki{left:50.7%;top:31.63%;width:47.2%;height:20.01%}
#lr{left:2.1%;top:52.43%;width:47.2%;height:19.86%}
#of{left:50.7%;top:52.43%;width:47.2%;height:19.86%}
#title{left:12%;top:8.39%;width:76%;height:7.36%}
#homebtn{left:4%;top:87.7%;width:22%;height:9%}
#badge{position:absolute;left:85.2%;top:89.85%;transform:translate(-50%,-50%);min-width:5.8%;aspect-ratio:1;height:auto;padding:0 1.2%;border-radius:999px;background:#e8202a;color:#fff;font-weight:800;font-size:clamp(10px,2.1vh,26px);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .35vh #0b1b38;pointer-events:none}
#badge.wide{aspect-ratio:auto;height:2.7%;min-width:9%}
#badge.pop{animation:pop .45s ease}
@keyframes pop{45%{transform:translate(-50%,-50%) scale(1.45)}}
#pill{position:absolute;left:66.3%;top:16.97%;width:31.2%;height:7.6%;border-radius:18%/30%;pointer-events:none}
#pill.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 2.2vh rgba(255,40,40,.75),inset 0 0 1.4vh rgba(255,60,60,.5)}}
#pill.flash{animation:flash .25s ease 4}
@keyframes flash{50%{background:rgba(255,60,60,.45)}}
#cam{position:absolute;inset:0;background:#000;display:none;transform-origin:0 0}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
#cam video.on{opacity:1}
#cam.zoom{transition:transform .45s cubic-bezier(.2,.8,.2,1),border-radius .45s}
#close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 1.2%);right:3%;width:5.2vh;height:5.2vh;border-radius:50%;background:rgba(0,0,0,.55);border:.25vh solid rgba(255,255,255,.85);color:#fff;display:none;align-items:center;justify-content:center;font-size:3.2vh;line-height:1;font-weight:600;z-index:5;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#close.show{display:flex}
#msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;background:rgba(5,12,28,.94);color:#fff;font-weight:700;font-size:2.6vh;text-align:center}
#msg .spin{width:6vh;height:6vh;border-radius:50%;border:.7vh solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#talkbar{position:absolute;left:0;right:0;bottom:0;padding:6vh 0 calc(env(safe-area-inset-bottom,0px) + 3.5vh);display:none;flex-direction:column;align-items:center;gap:1.4vh;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.7));z-index:5}
#talkbar.show{display:flex}
#talklbl{color:#fff;font-weight:700;font-size:2vh;text-shadow:0 1px 6px #000;display:flex;align-items:center;gap:1vh;min-height:2.6vh}
#wave{display:none;gap:.4vh;height:2.4vh;align-items:center}
#wave.on{display:flex}
#wave b{width:.5vh;border-radius:.3vh;background:#fff;animation:wv .7s ease-in-out infinite}
#wave b:nth-child(2){animation-delay:.1s}#wave b:nth-child(3){animation-delay:.2s}#wave b:nth-child(4){animation-delay:.3s}#wave b:nth-child(5){animation-delay:.15s}
@keyframes wv{0%,100%{height:.5vh}50%{height:2.4vh}}
#talk{width:11vh;height:11vh;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;touch-action:none;transition:transform .12s,background .12s;box-shadow:0 .8vh 3vh rgba(0,0,0,.55)}
#talk svg{width:4.6vh;height:4.6vh}
#talk.down{background:#2f7dff;color:#fff;transform:scale(1.12);box-shadow:0 0 0 1.3vh rgba(47,125,255,.35),0 0 0 2.8vh rgba(47,125,255,.15)}
#hint{position:absolute;left:0;right:0;bottom:1.2%;text-align:center;color:rgba(255,255,255,.0);font-size:1.4vh;pointer-events:none}
@media (prefers-reduced-motion:reduce){#cam.zoom{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <img id="home" src="home.jpg" alt="Cool House home screen">
  <div id="pill" class="glow"></div>
  <div id="badge">1</div>
  <div class="hot" id="title" aria-label="Cool House"></div>
  <div class="hot" id="fd" aria-label="Front Door"></div>
  <div class="hot" id="ki" aria-label="Kitchen"></div>
  <div class="hot" id="lr" aria-label="Living Room"></div>
  <div class="hot" id="of" aria-label="Office"></div>
  <div class="hot" id="homebtn" aria-label="Home"></div>
  <div id="cam"></div>
  <div id="close" aria-label="Close camera">&#x2715;</div>
  <div id="talkbar">
    <div id="talklbl"><span id="wave"><b></b><b></b><b></b><b></b><b></b></span><span id="talktxt">Hold to talk</span></div>
    <div id="talk" aria-label="Hold to talk"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></div>
  </div>
  <div id="msg"><div class="spin"></div><div id="msgtxt">Reconnecting...</div></div>
</div>
<script>
{
  /* ===== ROOMS: add clip files here as they're made (played in order) =====
     A clip can be 'file.mp4' or {v:'file.mp4', idle:'loop.mp4'}: the idle loop plays after the clip
     while Christopher talks. Rooms with talk:true advance with the Talk button (hold, speak, let go);
     other rooms advance with a tap. */
  const ROOMS={
    fd:{name:'Front Door', talk:true, clips:[
      {v:'fd1.mp4',idle:'fd1_idle.mp4'},  // hop up, squish, fog, "Knock knock!"   -> "Who's there?"
      {v:'fd2.mp4',idle:'fd2_idle.mp4'},  // "Elf!"                                 -> "Elf who?"
      {v:'fd3.mp4',idle:'fd3_idle.mp4'},  // "Elf me in, it's freezing out here!"   -> "NOPE! No elves allowed!"
      {v:'fd4.mp4'}                       // nyah-nyah, then freezes like a doll
    ]},
    ki:{name:'Kitchen',    clips:[]},
    lr:{name:'Living Room',clips:[]},
    of:{name:'Office',     clips:[]}
  };
  /* finale: plays after the 99+ count, zooming out of this tile */
  const FINALE={tile:'lr', clips:[]};

  const $=id=>document.getElementById(id);
  const stage=$('stage'),cam=$('cam'),badge=$('badge'),pill=$('pill'),msg=$('msg');
  let count=1,part=-1,busy=false,ac=null,cur=null,curTile=null;

  /* preload every clip so nothing buffers mid-show */
  const vids={};
  const norm=c=>typeof c==='string'?{v:c}:c;
  Object.values(ROOMS).forEach(r=>r.clips=r.clips.map(norm));FINALE.clips=FINALE.clips.map(norm);
  const allClips=[...Object.values(ROOMS).flatMap(r=>r.clips),...FINALE.clips].flatMap(c=>c.idle?[c.v,c.idle]:[c.v]);
  allClips.forEach(src=>{const v=document.createElement('video');v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';cam.appendChild(v);vids[src]=v;fetch(src).then(r=>r.blob()).then(b=>{v.src=URL.createObjectURL(b);v.load()}).catch(()=>{v.src=src;v.load()})});
  if('serviceWorker' in navigator&&location.protocol==='https:'){const hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').then(r=>{try{r.update()}catch(e){}}).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!window.__rl){window.__rl=1;location.reload()}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{})})}

  /* keep the screen awake where allowed */
  const wake=()=>{try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}};

  /* ---- sound: two-note phone chime ---- */
  const audio=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac};
  const ding=()=>{const a=audio();if(!a)return;const t=a.currentTime;[[1318.5,0],[1760,.12]].forEach(([f,d])=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.35,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.6);o.connect(g).connect(a.destination);o.start(t+d);o.stop(t+d+.65)})};

  /* ---- badge ---- */
  const setBadge=n=>{count=n;badge.textContent=n>99?'99+':n;badge.classList.toggle('wide',n>9);badge.classList.remove('pop');void badge.offsetWidth;badge.classList.add('pop')};
  const flashPill=()=>{pill.classList.remove('flash');void pill.offsetWidth;pill.classList.add('flash');setTimeout(()=>pill.classList.remove('flash'),1100)};
  const alertNew=()=>{ding();setBadge(count+1);flashPill()};
  const finale=()=>{if(busy)return;busy=true;let n=count;const step=()=>{n+=n<10?1:n<30?3:9;if(n>=99){setBadge(100);ding();flashPill();busy=false;if(FINALE.clips.length)setTimeout(()=>openCam($(FINALE.tile),FINALE.clips),1200);return}setBadge(n);ding();setTimeout(step,Math.max(70,260-n*4))};step()};

  /* ---- secret controls on the title: tap = new alert, hold = 99+ finale ---- */
  let holdT=null,held=false;const title=$('title');
  title.addEventListener('pointerdown',()=>{audio();wake();held=false;holdT=setTimeout(()=>{held=true;finale()},700)});
  title.addEventListener('pointerup',()=>{clearTimeout(holdT);if(!held)alertNew()});
  title.addEventListener('pointerleave',()=>clearTimeout(holdT));
  /* hold Home 1.5s = reset badge to 1 */
  let rT=null;$('homebtn').addEventListener('pointerdown',()=>{rT=setTimeout(()=>setBadge(1),1500)});
  $('homebtn').addEventListener('pointerup',()=>clearTimeout(rT));

  /* ---- open a camera: zoom out of its tile, play clip 1; tap = next clip; tap after last = back home ---- */
  const flashTile=el=>{el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')};
  const tileXf=el=>{const sr=stage.getBoundingClientRect(),tr=el.getBoundingClientRect();return `translate(${tr.left-sr.left}px,${tr.top-sr.top}px) scale(${tr.width/sr.width},${tr.height/sr.height})`};
  let talkRoom=false;
  /* iPhone only allows sound after a tap, so on opening a camera, quietly unlock every clip in that room */
  const prime=clips=>clips.flatMap(c=>c.idle?[c.v,c.idle]:[c.v]).slice(1).forEach(src=>{const v=vids[src];const p=(v.muted=true,v.play());const back=()=>{v.pause();try{v.currentTime=0}catch(e){}v.muted=false};if(p&&p.then)p.then(back).catch(()=>{v.muted=false});else back()});
  const openCam=(tile,clips,talk)=>{
    if(busy)return;busy=true;audio();wake();flashTile(tile);
    cur=clips;curTile=tile;talkRoom=!!talk;
    Object.values(vids).forEach(v=>{v.pause();v.onended=null;v.classList.remove('on')});
    prime(clips);
    const first=vids[clips[0].v];first.currentTime=0;first.classList.add('on');
    cam.classList.remove('zoom');cam.style.display='block';cam.style.transform=tileXf(tile);cam.style.borderRadius='6%';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{cam.classList.add('zoom');cam.style.transform='none';cam.style.borderRadius='0'}));
    setTimeout(()=>{playPart(0);busy=false;$('close').classList.add('show');$('talkbar').classList.toggle('show',talkRoom)},470);
  };
  /* show a video only once it is actually playing, so there is never a black flash */
  const playSrc=(src,loop)=>{
    const v=vids[src];v.loop=!!loop;try{v.currentTime=0}catch(e){}
    const swap=()=>{v.removeEventListener('playing',swap);v.classList.add('on');Object.values(vids).forEach(o=>{if(o!==v){o.classList.remove('on');o.pause()}})};
    v.addEventListener('playing',swap);
    const p=v.play();if(p&&p.catch)p.catch(()=>v.removeEventListener('playing',swap));
  };
  const playPart=i=>{part=i;const c=cur[i];const v=vids[c.v];v.onended=()=>{if(part===i&&c.idle)playSrc(c.idle,true)};playSrc(c.v,false)};
  const closeCam=()=>{if(cam.style.display!=='block')return;busy=true;$('close').classList.remove('show');$('talkbar').classList.remove('show');Object.values(vids).forEach(v=>{v.pause();v.onended=null});cam.style.transform=tileXf(curTile);cam.style.borderRadius='6%';setTimeout(()=>{cam.style.display='none';cam.classList.remove('zoom');part=-1;busy=false},470)};

  /* ---- Talk button: hold while speaking, let go to play the next part (quick taps are ignored) ---- */
  const talkEl=$('talk');let tDown=false,tAt=0;
  const tPress=e=>{e.preventDefault();e.stopPropagation();tDown=true;tAt=Date.now();talkEl.classList.add('down');$('wave').classList.add('on');$('talktxt').textContent='Talking...'};
  const tRelease=e=>{if(!tDown)return;e.preventDefault();e.stopPropagation();tDown=false;talkEl.classList.remove('down');$('wave').classList.remove('on');$('talktxt').textContent='Hold to talk';if(Date.now()-tAt<300||!cur)return;if(part<cur.length-1)playPart(part+1)};
  talkEl.addEventListener('pointerdown',tPress);talkEl.addEventListener('pointerup',tRelease);talkEl.addEventListener('pointercancel',tRelease);talkEl.addEventListener('pointerleave',tRelease);
  $('talkbar').addEventListener('click',e=>e.stopPropagation());$('talkbar').addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
  talkEl.addEventListener('contextmenu',e=>e.preventDefault());
  $('close').addEventListener('click',e=>{e.stopPropagation();if(!busy)closeCam()});
  let sy=null,swiped=false;
  cam.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;swiped=false},{passive:true});
  cam.addEventListener('touchmove',e=>{if(sy!==null&&e.touches[0].clientY-sy>70&&!swiped&&!busy){swiped=true;closeCam()}},{passive:true});
  cam.addEventListener('click',()=>{if(swiped){swiped=false;return}if(busy||!cur||talkRoom)return;if(part<cur.length-1)playPart(part+1);else closeCam()});

  const reconnecting=(tile,name)=>{flashTile(tile);$('msgtxt').textContent=name+' camera: Reconnecting...';msg.style.display='flex';setTimeout(()=>msg.style.display='none',2200)};
  Object.entries(ROOMS).forEach(([id,r])=>{const t=$(id);t.addEventListener('click',()=>r.clips.length?openCam(t,r.clips,r.talk):reconnecting(t,r.name))});
  msg.addEventListener('click',()=>msg.style.display='none');
}
</script>
</body>
</html>
