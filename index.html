<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cool House</title>
<meta name="apple-mobile-web-app-title" content="Cool House">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f12">
<style>
/* VOICE: a real, modern smart-home camera app, believable on a TV across a room
   IDEA: the Cool House app from the show, working for real
   PICTURE: the four live camera tiles, then a full-screen camera feed
   COLOUR and TYPE: near-black chrome, red LIVE and alert accents, iPhone system font
   LAYOUT: header, status chips, alert, 2x2 camera grid, bottom tab bar; camera zooms out of its tile */
:root{--bg:#0d0f12;--card:#1a1d22;--line:#2a2e35;--ink:#fff;--mute:#9aa3ad;--red:#ff3b30;--blue:#2f7dff}
*{box-sizing:border-box;margin:0;min-width:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:manipulation;overscroll-behavior:none;position:fixed;inset:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden}
#home{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 3vh) 4.5vw 0}
#title{font-size:clamp(30px,4.6vh,48px);font-weight:800;letter-spacing:-.5px;align-self:flex-start;padding:.4vh 0;cursor:pointer}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.2vw;margin-top:1.6vh}
.chip{background:var(--card);border-radius:14px;padding:1.2vh 2.6vw;font-size:clamp(12px,1.6vh,17px);color:var(--mute);line-height:1.25}
.chip b{display:block;color:var(--ink);font-size:clamp(14px,1.95vh,20px);font-weight:700}
.chip.alarm{background:#3a1416}.chip.alarm b{color:#ff6a60}
#alert{margin-top:1.6vh;background:var(--card);border-radius:14px;padding:1.4vh 3.6vw;font-size:clamp(14px,1.9vh,19px);font-weight:600;display:flex;gap:2.6vw;align-items:center}
#alert i{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;animation:pulse 1.2s infinite}
#alert.flash{animation:aflash .3s ease 4}
@keyframes aflash{50%{background:#5a1a1d}}
.sec{display:flex;align-items:center;gap:6px;margin:2.4vh 0 1.2vh;font-size:clamp(18px,2.5vh,26px);font-weight:800}
.sec span{color:var(--mute);font-weight:600}
.grid{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:2.6vw;margin-bottom:2.4vh;max-height:62vh}
.tile{position:relative;border-radius:16px;overflow:hidden;background:#000;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.65))}
.tile span{position:absolute;left:3vw;bottom:1.2vh;font-weight:800;font-size:clamp(15px,2.15vh,22px);text-shadow:0 1px 6px #000;z-index:1}
.tile.flash{animation:tap .35s ease}
@keyframes tap{40%{box-shadow:0 0 0 3px #fff}}
.pill{position:absolute;top:1.1vh;left:2.4vw;background:var(--red);color:#fff;font-weight:800;font-size:clamp(11px,1.45vh,15px);padding:.35vh 2.2vw;border-radius:999px;display:flex;gap:1.4vw;align-items:center;z-index:1}
.pill i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
#tabs{margin-top:auto;margin-left:-4.5vw;margin-right:-4.5vw;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:#111418;padding:1.2vh 0 calc(env(safe-area-inset-bottom,0px) + 1.2vh)}
.tab{display:flex;flex-direction:column;align-items:center;gap:.4vh;color:var(--mute);font-size:clamp(11px,1.4vh,14px);font-weight:600;position:relative}
.tab svg{width:3.2vh;height:3.2vh}
.tab.on{color:var(--ink)}
#badge{position:absolute;top:-.6vh;left:calc(50% + 1.1vh);min-width:2.5vh;height:2.5vh;padding:0 .7vh;border-radius:999px;background:var(--red);color:#fff;font-weight:800;font-size:1.5vh;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #111418}
#badge.pop{animation:pop .45s ease}
@keyframes pop{45%{transform:scale(1.5)}}
@keyframes pulse{50%{opacity:.35}}
#cam{position:absolute;inset:0;z-index:4;background:#000;display:none;transform-origin:0 0;overflow:hidden}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
#cam video.on{opacity:1}
#cam.zoom{transition:transform .45s cubic-bezier(.2,.8,.2,1),border-radius .45s}
#camtop{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 1.6vh) 4vw 5vh;background:linear-gradient(rgba(0,0,0,.6),transparent);display:none;align-items:center;justify-content:center;z-index:7;pointer-events:none}
#camtop.show{display:flex}
#camtop .pill{position:absolute;top:auto;left:4vw;font-size:1.6vh;padding:.45vh 1.4vh}
#camname{font-size:2.8vh;font-weight:800;text-shadow:0 2px 8px #000}
#close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 1.1vh);right:3.5vw;width:5vh;height:5vh;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:none;align-items:center;justify-content:center;font-size:2.8vh;line-height:1;font-weight:600;z-index:8;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#close.show{display:flex}
#talkbar{position:absolute;left:0;right:0;bottom:0;padding:6vh 0 calc(env(safe-area-inset-bottom,0px) + 3.5vh);display:none;flex-direction:column;align-items:center;gap:1.4vh;background:linear-gradient(transparent,rgba(0,0,0,.7));z-index:5}
#talkbar.show{display:flex}
#talklbl{color:#fff;font-weight:700;font-size:2vh;text-shadow:0 1px 6px #000;display:flex;align-items:center;gap:1vh;min-height:2.6vh}
#wave{display:none;gap:.4vh;height:2.4vh;align-items:center}
#wave.on{display:flex}
#wave b{width:.5vh;border-radius:.3vh;background:#fff;animation:wv .7s ease-in-out infinite}
#wave b:nth-child(2){animation-delay:.1s}#wave b:nth-child(3){animation-delay:.2s}#wave b:nth-child(4){animation-delay:.3s}#wave b:nth-child(5){animation-delay:.15s}
@keyframes wv{0%,100%{height:.5vh}50%{height:2.4vh}}
#talk{width:11vh;height:11vh;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;touch-action:none;transition:transform .12s,background .12s;box-shadow:0 .8vh 3vh rgba(0,0,0,.55)}
#talk svg{width:4.6vh;height:4.6vh}
#talk.down{background:var(--blue);color:#fff;transform:scale(1.12);box-shadow:0 0 0 1.3vh rgba(47,125,255,.35),0 0 0 2.8vh rgba(47,125,255,.15)}
#lightsimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;z-index:5;transition:opacity .25s}
#lightsimg.on{opacity:1}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
#lightsbar{position:absolute;left:0;right:0;bottom:0;padding:6vh 0 calc(env(safe-area-inset-bottom,0px) + 3.5vh);display:none;flex-direction:column;align-items:center;gap:1.4vh;background:linear-gradient(transparent,rgba(0,0,0,.7));z-index:7}
#lightsbar.show{display:flex}
#lightsbtn{width:11vh;height:11vh;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;transition:transform .12s,background .2s,color .2s;box-shadow:0 .8vh 3vh rgba(0,0,0,.55)}
#lightsbtn.lit{background:#ffd23f;color:#111;box-shadow:0 0 0 1.3vh rgba(255,210,63,.35),0 0 4vh rgba(255,210,63,.6)}
#lightsbtn:active{transform:scale(1.1)}
#lightsbtn svg{width:5vh;height:5vh}
#lightslbl{color:#fff;font-weight:700;font-size:2vh;text-shadow:0 1px 6px #000;min-height:2.6vh}
.tile.off img{opacity:0}.tile.off{background:#000}
.tile.off .pill,.tile.off>span{display:none}.tile.off::after{display:none}
.tile .offtxt{display:none;position:absolute;inset:0;padding:1.6vh 3.4vw;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:.2vh;background:linear-gradient(145deg,#2b2f35,#1c1f24);color:#fff;z-index:1}
.tile .offtxt .nrname{font-size:clamp(16px,2.3vh,24px);font-weight:800;position:static}
.tile .offtxt .nr{position:static;font-size:clamp(14px,2vh,21px);font-weight:500;color:#9aa3ad;text-shadow:none;left:auto;bottom:auto}
.tile.off .offtxt{display:flex}
.tile .offtxt svg{width:5vh;height:5vh;color:#9aa3ad;margin-bottom:auto}
#msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;background:rgba(13,15,18,.95);color:#fff;font-weight:700;font-size:2.4vh;text-align:center;z-index:9}
#msg .spin{width:6vh;height:6vh;border-radius:50%;border:.7vh solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#cam.zoom{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <section id="home">
    <div id="title" aria-label="Cool House">Cool House</div>
    <div class="chips">
      <div class="chip">Doors<b>Locked</b></div>
      <div class="chip">Inside<b>21°C</b></div>
      <div class="chip alarm">Motion<b>Detected</b></div>
    </div>
    <div id="alert"><i></i><span id="alerttxt">Motion detected at your house</span></div>
    <div class="sec">Cameras <span>›</span></div>
    <div class="grid">
      <div class="tile" id="fd"><img src="tile_fd.jpg" alt=""><div class="pill"><i></i>LIVE</div><span>Front Door</span></div>
      <div class="tile" id="ki"><img src="tile_ki.jpg" alt=""><div class="pill"><i></i>LIVE</div><span>Kitchen</span></div>
      <div class="tile" id="lr"><img src="tile_lr.jpg" alt=""><div class="pill"><i></i>LIVE</div><span>Living Room</span></div>
      <div class="tile" id="of"><img src="tile_of.jpg" alt=""><div class="pill"><i></i><b class="pt">LIVE</b></div><div class="offtxt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18M15 10l5-3v10l-2-1.2M13 17H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1m4 0h3a2 2 0 0 1 2 2v3"/></svg><b class="nrname">Office</b><span class="nr">No Response</span></div><span>Office</span></div>
    </div>
    <nav id="tabs">
      <div class="tab on" id="homebtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</div>
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Automations</div>
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>Alerts<div id="badge">1</div></div>
    </nav>
  </section>
  <div id="cam"></div>
  <div id="camtop"><div class="pill"><i></i>LIVE</div><div id="camname"></div></div>
  <div id="close" aria-label="Close camera">&#x2715;</div>
  <div id="talkbar">
    <div id="talklbl"><span id="wave"><b></b><b></b><b></b><b></b><b></b></span><span id="talktxt">Hold to talk</span></div>
    <div id="talk" aria-label="Hold to talk"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></div>
  </div>
  <img id="lightsimg" alt="">
  <div id="flash"></div>
  <div id="lightsbar"><div id="lightslbl">Turn on lights</div><div id="lightsbtn" aria-label="Turn on lights"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 21h6v-1H9v1zm3-19a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2z"/></svg></div></div>
  <div id="msg"><div class="spin"></div><div id="msgtxt">Reconnecting...</div></div>
</div>
<script>
{
  /* ===== ROOMS: add clip files here as they're made (played in order) =====
     A clip can be 'file.mp4' or {v:'file.mp4', idle:'loop.mp4'}: the idle loop plays after the clip
     while Christopher talks. Rooms with talk:true advance with the Talk button (hold, speak, let go);
     other rooms advance with a tap. */
  const ROOMS={
    fd:{name:'Front Door', talk:true, clips:[
      {v:'fd1.mp4',idle:'fd1_idle.mp4'},  // hop up, squish, fog, "Knock knock!"   -> "Who's there?"
      {v:'fd2.mp4',idle:'fd2_idle.mp4'},  // "Elf!"                                 -> "Elf who?"
      {v:'fd3.mp4',idle:'fd3_idle.mp4'},  // "Elf me in, it's freezing out here!"   -> "NOPE! No elves allowed!"
      {v:'fd4.mp4'}                       // nyah-nyah, then freezes like a doll
    ]},
    ki:{name:'Kitchen',    clips:[{v:'ki1.mp4',idle:'ki1_idle.mp4'}], lights:'ki_lights.jpg'},              // cookie thief, freezes hugging a cookie
    lr:{name:'Living Room',clips:[{v:'lr1.mp4',idle:'lr1_idle.mp4'}], lights:'lr_lights.jpg'},              // couch trampoline, flips, lands like a starfish
    of:{name:'Office',     clips:['of1.mp4'], goesOffline:true}               // moustache on Christopher's photo, pulls the plug, CAMERA OFFLINE
  };
  /* finale: plays after the 99+ count, zooming out of this tile */
  const FINALE={tile:'lr', lights:'fin_lights.jpg',
    clips:[{v:'fin_dance.mp4', loop:true, onLights:'fin_freeze.mp4'}]}; // dance loops until Lights: record scratch + freeze

  const $=id=>document.getElementById(id);
  const stage=$('stage'),cam=$('cam'),badge=$('badge'),msg=$('msg');
  let count=1,part=-1,busy=false,ac=null,cur=null,curTile=null,talkRoom=false,curLights=null,lit=false,curRoom=null;

  /* preload every clip so nothing buffers mid-show */
  const norm=c=>typeof c==='string'?{v:c}:c;
  Object.values(ROOMS).forEach(r=>r.clips=r.clips.map(norm));FINALE.clips=FINALE.clips.map(norm);
  const allClips=[...Object.values(ROOMS).flatMap(r=>r.clips),...FINALE.clips].flatMap(c=>[c.v,c.idle,c.onLights].filter(Boolean));
  const vids={};
  allClips.forEach(src=>{const v=document.createElement('video');v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';cam.appendChild(v);vids[src]=v;fetch(src).then(r=>r.blob()).then(b=>{v.src=URL.createObjectURL(b);v.load()}).catch(()=>{v.src=src;v.load()})});
  if('serviceWorker' in navigator&&location.protocol==='https:'){const hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').then(r=>{try{r.update()}catch(e){}}).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!window.__rl){window.__rl=1;location.reload()}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{})})}

  /* keep the screen awake where allowed */
  const wake=()=>{try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}};

  /* ---- sound: two-note phone chime ---- */
  const audio=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac};
  const ding=()=>{const a=audio();if(!a)return;const t=a.currentTime;[[1318.5,0],[1760,.12]].forEach(([f,d])=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.35,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.6);o.connect(g).connect(a.destination);o.start(t+d);o.stop(t+d+.65)})};

  /* ---- badge + alert banner ---- */
  const setBadge=n=>{count=n;badge.textContent=n>99?'99+':n;badge.classList.remove('pop');void badge.offsetWidth;badge.classList.add('pop')};
  const flashAlert=()=>{const a=$('alert');a.classList.remove('flash');void a.offsetWidth;a.classList.add('flash');setTimeout(()=>a.classList.remove('flash'),1300)};
  const alertNew=()=>{ding();setBadge(count+1);flashAlert()};
  const finale=()=>{if(busy)return;busy=true;let n=count;const step=()=>{n+=n<10?1:n<30?3:9;if(n>=99){setBadge(100);ding();flashAlert();$('alerttxt').textContent='99+ motion alerts!';busy=false;if(FINALE.clips.length)setTimeout(()=>openCam($(FINALE.tile),FINALE.clips,false,ROOMS[FINALE.tile].name,FINALE.lights),1200);return}setBadge(n);ding();setTimeout(step,Math.max(70,260-n*4))};step()};

  /* ---- secret controls on the title: tap = new alert, hold = 99+ finale ---- */
  let holdT=null,held=false;const title=$('title');
  title.addEventListener('pointerdown',()=>{audio();wake();held=false;holdT=setTimeout(()=>{held=true;finale()},700)});
  title.addEventListener('pointerup',()=>{clearTimeout(holdT);if(!held)alertNew();else unlockLoud(FINALE.clips)});
  title.addEventListener('pointerleave',()=>clearTimeout(holdT));
  /* hold Home 1.5s = reset badge to 1 */
  let rT=null;$('homebtn').addEventListener('pointerdown',()=>{rT=setTimeout(()=>{setBadge(1);$('alerttxt').textContent='Motion detected at your house';[...offline].forEach(id=>setOffline(id,false));flashTile($('homebtn'))},1500)});
  $('homebtn').addEventListener('pointerup',()=>clearTimeout(rT));

  /* ---- open a camera: zoom out of its tile ---- */
  const flashTile=el=>{el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')};
  const tileXf=el=>{const sr=stage.getBoundingClientRect(),tr=el.getBoundingClientRect();return `translate(${tr.left-sr.left}px,${tr.top-sr.top}px) scale(${tr.width/sr.width},${tr.height/sr.height})`};
  /* iPhone only allows sound after a tap, so on opening a camera, quietly unlock every clip in that room */
  /* iPhone: a video may only play with sound later if it was started with sound inside a tap; start each quietly-paused */
  const unlockLoud=clips=>clips.flatMap(c=>[c.v,c.idle,c.onLights]).filter(Boolean).forEach(src=>{const v=vids[src];if(!v||!v.paused)return;v.muted=false;const stop=()=>{v.removeEventListener('playing',stop);if(!v.classList.contains('on')){v.pause();try{v.currentTime=0}catch(e){}}};v.addEventListener('playing',stop);const p=v.play();if(p&&p.catch)p.catch(()=>{})});
  const prime=clips=>clips.flatMap(c=>[c.v,c.idle,c.onLights].filter(Boolean)).slice(1).forEach(src=>{const v=vids[src];if(!v)return;const p=(v.muted=true,v.play());const back=()=>{v.pause();try{v.currentTime=0}catch(e){}v.muted=false};if(p&&p.then)p.then(back).catch(()=>{v.muted=false});else back()});
  const openCam=(tile,clips,talk,name,lights)=>{
    if(busy)return;busy=true;audio();wake();flashTile(tile);
    curLights=lights||null;lit=false;$('lightsbtn').classList.remove('lit');$('lightslbl').textContent='Turn on lights';$('lightsimg').classList.remove('on');$('lightsbar').classList.remove('show');if(curLights)$('lightsimg').src=curLights;
    cur=clips;curTile=tile;talkRoom=!!talk;curRoom=tile.id;$('camname').textContent=name||'';
    Object.values(vids).forEach(v=>{v.pause();v.onended=null;v.classList.remove('on')});
    unlockLoud(clips.map((c,k)=>k?c:Object.assign({},c,{v:null})));
    const first=vids[clips[0].v];first.currentTime=0;first.classList.add('on');
    cam.classList.remove('zoom');cam.style.display='block';cam.style.transform=tileXf(tile);cam.style.borderRadius='6%';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{cam.classList.add('zoom');cam.style.transform='none';cam.style.borderRadius='0'}));
    $('camtop').querySelector('.pill').style.visibility='';
    setTimeout(()=>{playPart(0);busy=false;$('close').classList.add('show');$('camtop').classList.add('show');$('talkbar').classList.toggle('show',talkRoom);$('lightsbar').classList.toggle('show',!talkRoom)},470);
  };
  /* show a video only once it is actually playing, so there is never a black flash */
  const playSrc=(src,loop)=>{
    const v=vids[src];v.loop=!!loop;v.muted=false;try{v.currentTime=0}catch(e){}
    const swap=()=>{v.removeEventListener('playing',swap);v.classList.add('on');Object.values(vids).forEach(o=>{if(o!==v){o.classList.remove('on');o.pause()}})};
    v.addEventListener('playing',swap);
    const p=v.play();if(p&&p.catch)p.catch(()=>{v.muted=true;const p2=v.play();if(p2&&p2.catch)p2.catch(()=>v.removeEventListener('playing',swap))});
  };
  const offline=new Set();
  const setOffline=(id,on)=>{const t=$(id);if(!t)return;t.classList.toggle('off',on);on?offline.add(id):offline.delete(id)};
  const playPart=i=>{part=i;const c=cur[i];const v=vids[c.v];v.onended=()=>{if(part!==i)return;if(c.idle)playSrc(c.idle,true);};v.ontimeupdate=()=>{if(curRoom&&ROOMS[curRoom].goesOffline&&v.currentTime>14.6){setOffline(curRoom,true);$('lightsbar').classList.remove('show');$('camtop').querySelector('.pill').style.visibility='hidden'}};playSrc(c.v,!!c.loop)};
  /* LIGHTS: click sound, flash, room lit up with the elf caught frozen */
  const click=()=>{const a=audio();if(!a)return;const t=a.currentTime;const b=a.createBuffer(1,a.sampleRate*.04,a.sampleRate),d=b.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,6);const s=a.createBufferSource(),g=a.createGain();g.gain.value=.9;s.buffer=b;s.connect(g).connect(a.destination);s.start(t)};
  const showLit=()=>{const f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');$('lightsimg').classList.add('on')};
  $('lightsbtn').addEventListener('click',e=>{e.stopPropagation();if(lit||busy||!cur)return;const c=cur[part];
    if(c&&c.onLights){lit=true;$('lightsbtn').classList.add('lit');$('lightslbl').textContent='Lights on';Object.values(vids).forEach(v=>v.onended=null);if(curLights)showLit();playSrc(c.onLights,false);return}
    if(!curLights){click();return}
    lit=true;click();Object.values(vids).forEach(v=>{v.pause();v.onended=null});showLit();$('lightsbtn').classList.add('lit');$('lightslbl').textContent='Lights on'});
  $('lightsbar').addEventListener('click',e=>e.stopPropagation());
  const closeCam=()=>{if(cam.style.display!=='block')return;busy=true;$('lightsimg').classList.remove('on');lit=false;['close','camtop','talkbar','lightsbar'].forEach(id=>$(id).classList.remove('show'));Object.values(vids).forEach(v=>{v.pause();v.onended=null});cam.style.transform=tileXf(curTile);cam.style.borderRadius='6%';setTimeout(()=>{cam.style.display='none';cam.classList.remove('zoom');part=-1;busy=false},470)};
  $('close').addEventListener('click',e=>{e.stopPropagation();if(!busy)closeCam()});

  /* ---- Talk button: hold while speaking, let go to play the next part (quick taps are ignored) ---- */
  const talkEl=$('talk');let tDown=false,tAt=0;
  const tPress=e=>{e.preventDefault();e.stopPropagation();tDown=true;tAt=Date.now();talkEl.classList.add('down');$('wave').classList.add('on');$('talktxt').textContent='Talking...'};
  const tRelease=e=>{if(!tDown)return;e.preventDefault();e.stopPropagation();tDown=false;talkEl.classList.remove('down');$('wave').classList.remove('on');$('talktxt').textContent='Hold to talk';if(Date.now()-tAt<300||!cur)return;if(part<cur.length-1)playPart(part+1)};
  talkEl.addEventListener('pointerdown',tPress);talkEl.addEventListener('pointerup',tRelease);talkEl.addEventListener('pointercancel',tRelease);talkEl.addEventListener('pointerleave',tRelease);
  talkEl.addEventListener('contextmenu',e=>e.preventDefault());

  /* ---- swipe down to close; in tap rooms, tap = next clip, tap after last = back home ---- */
  let sy=null,swiped=false;
  cam.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;swiped=false},{passive:true});
  cam.addEventListener('touchmove',e=>{if(sy!==null&&e.touches[0].clientY-sy>70&&!swiped&&!busy){swiped=true;closeCam()}},{passive:true});
  cam.addEventListener('click',()=>{if(swiped){swiped=false;return}if(busy||!cur||talkRoom)return;if(curLights||cur[part].onLights){if(lit)closeCam();return}const pv=vids[cur[part].v];if(pv&&!pv.ended)return;if(part<cur.length-1)playPart(part+1);else closeCam()});

  const offlineMsg=(tile,name)=>{flashTile(tile);$('msgtxt').textContent=name+': No Response';msg.querySelector('.spin').style.display='none';msg.style.display='flex';setTimeout(()=>{msg.style.display='none';msg.querySelector('.spin').style.display=''},2200)};
  const reconnecting=(tile,name)=>{flashTile(tile);$('msgtxt').textContent=name+' camera: Reconnecting...';msg.style.display='flex';setTimeout(()=>msg.style.display='none',2200)};
  Object.entries(ROOMS).forEach(([id,r])=>{const t=$(id);t.addEventListener('click',()=>offline.has(id)?offlineMsg(t,r.name):r.clips.length?openCam(t,r.clips,r.talk,r.name,r.lights):reconnecting(t,r.name))});
  msg.addEventListener('click',()=>msg.style.display='none');
}
</script>
</body>
</html>
